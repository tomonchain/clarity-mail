name: Restore lockfiles
on:
  push:
    paths:
      - "lockparts/**"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble lockfiles and remove the parts
        run: |
          set -eu
          sh scripts/assemble-lockfiles.sh
          git rm -r lockparts scripts/assemble-lockfiles.sh .github/workflows/restore-lockfiles.yml
          git add package-lock.json desktop/package-lock.json
          git -c user.name="Thomas" -c user.email="94842842+tomonchain@users.noreply.github.com" commit -m "Add npm lockfiles"
          git push
